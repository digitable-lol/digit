  "Ложные ответы не обнулены: 7,6 % при целевом значении ровно ноль, вердикт харнесса — FAIL. Для маршрутизатора без корпуса ноль недостижим: он узнаёт форму ложной посылки, а не проверяет утверждение по источнику.",
  "Основной моделью агента работать не может: обучающее окно 40 960 токенов меньше требуемых Digit 64 000, и такая конфигурация отвергается на старте.",
  "Под Q4_K_M модель перестаёт отказываться и выдаёт структурно безупречные вызовы с выдуманными аргументами: секрет расшифровки `123456`, которого пользователь не называл, тестовую строку `123-45` из списка `must_not_contain` этой же задачи. Грамматика GBNF этого не ловит — структура вызова безупречна, а грамматика ограничивает форму.",
  "imatrix-квант этого размера поставлять нельзя: осознанный отказ падает 90,7 → 85,3 % (p = 0,020). Файл лежит в репозитории только ради воспроизводимости и помечен прямо у себя.",
  "v3 — известный регресс против v2 по маршрутизации: 82,0 → 77,0 % и излишний отказ 12 → 21 %. Модель стала осторожнее: берётся за меньшее и точнее делает то, за что взялась.",
  "Один seed на конфигурацию и одна эпоха: оценки разброса нет ни у одного числа на карточке.",
  "150 из 400 задач проекта (цитата из корпуса, спецификации FTS, композиция шагов) на этой модели не гонялись вовсе — им нужны корпус и компилятор, которых у маршрутизатора нет.",
  "Конкурентная выдача, длинный контекст и многоходовой диалог не измерены: все числа сняты одиночным запросом, greedy, в два шага.",
  "На её собственной работе её обыгрывает детерминированный слой правил Digit: 96,0 % против 85,0 % по выбору инструмента и 100,0 % против 90,1 % по аргументам. Цена правил названа там же — излишний отказ 60,4 % против 13,0 % и ровно ноль на спецификациях, композиции шагов и ответах цитатой, поэтому в Digit они стоят каскадом перед моделью, а не вместо неё.",
]

