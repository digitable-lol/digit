# Каталог наших открытых моделей и датасетов на Hugging Face.
#
# ЭТО ЕДИНСТВЕННЫЙ ИСТОЧНИК ПРАВДЫ. Читают его двое:
#
#   * Digit — `digit model --catalog` (digit_cli/hf_catalog.py);
#   * портал — data/hf-catalog.toml в репозитории courses, куда файл КОПИРУЕТСЯ
#     скриптом scripts/sync-hf-catalog.mjs, а его режим --check стоит в тестах
#     портала и падает, если копия разошлась с оригиналом.
#
# Почему копия, а не второй список. Каталог из восьми ссылок с числами живёт в
# двух местах и обязан говорить одно и то же: разошедшиеся списки обнаруживает
# не сборка, а читатель, который сверил страницу с выводом команды и перестал
# верить обоим. Копия проверяется побайтово, второй список — ничем.
#
# ПРАВИЛА ЗАПИСИ
#
#   1. Ни одного числа «из головы». Каждая запись evidence несёт source — место,
#      где число посчитано: раздел карточки модели на HF (сами карточки лежат в
#      digit-ml/publish*/cards/) или файл отчёта. Числа, которого нет в
#      источнике, здесь быть не может.
#   2. limits — обязательное поле, и оно не для галочки. Модель, у которой
#      названы только сильные стороны, читается как реклама, и ей перестают
#      верить вместе со всем остальным каталогом. Если границы неизвестны — так
#      и пишется, что не измерено.
#   3. Замеров нет — пишем «не измерено», а не молчим. Молчание читается как
#      «измерено и хорошо».
#   4. Размеры — из MANIFEST.json соответствующего репозитория (там sha256 и
#      size_bytes каждого файла), а не с глазомера.
#
# ПОРЯДОК КЛЮЧЕЙ ВНУТРИ ЗАПИСИ ОБЯЗАТЕЛЕН: сначала все простые поля и массив
# limits, и только потом блоки [[entry.evidence]]. TOML относит любой ключ после
# заголовка подтаблицы к ЭТОЙ подтаблице, поэтому limits, съехавший вниз, тихо
# станет полем последней улики и с страницы пропадёт.
#
# kind:  model | dataset
# role:  shipping   — то, что реально едет в поставке
#        reference  — эталон для сравнения, в поставку не входит
#        negative   — опубликованный отрицательный результат
#        training   — обучающие данные
#        eval       — набор задач, которым меряют

schema_version = 1
org = "digitable-lol"
org_url = "https://huggingface.co/digitable-lol"
updated = "2026-08-08"


