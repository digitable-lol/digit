#
# docker-compose.windows.yml — Windows Docker Desktop compatible
#
# Differences from docker-compose.yml:
#   - Removes `network_mode: host` (not supported on Docker Desktop for Windows)
#   - Uses explicit port mappings instead
#   - Uses Windows-style volume path for ~/.digit
#
# Usage:
#   docker compose -f docker-compose.windows.yml up -d
#
# Образ, как и в docker-compose.yml, собирается из этого репозитория
# (`build: .`). Здесь оставалось `image: nousresearch/hermes-agent:latest` —
# то есть на Windows compose тянул чужой образ вышестоящего проекта и
# запускал Hermes Agent поверх ~/.digit, собранного Digit. Своего
# опубликованного образа у форка нет: .github/workflows/docker.yml собирает
# и пушит только при `github.repository == 'NousResearch/hermes-agent'`.
services:
  gateway:
    build: .
    image: digit
    container_name: digit
    restart: unless-stopped
    volumes:
      - ${USERPROFILE}/.digit:/opt/data
    environment:
      - DIGIT_UID=10000
      - DIGIT_GID=10000
    command: ["gateway", "run"]

  dashboard:
    image: digit
    container_name: digit-dashboard
    restart: unless-stopped
    depends_on:
      - gateway
    volumes:
      - ${USERPROFILE}/.digit:/opt/data
    environment:
      - DIGIT_UID=10000
      - DIGIT_GID=10000
      - DIGIT_DASHBOARD_HOST=0.0.0.0
    ports:
      - "127.0.0.1:9119:9119"
    command: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open", "--insecure"]
